# fly.toml app configuration file generated for SILLA
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "silla-depi-platform"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  HOST = "0.0.0.0"
  PORT = "8000"
  SILLA_DB_PATH = "SILLA_Data_Engineering/database/silla_staging.db"
  FRONTEND_DIST_DIR = "/app/dist"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
